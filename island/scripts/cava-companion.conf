[general]
bars = 14
framerate = 30
autosens = 1
overshoot = 20
sensitivity = 180

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
integral = 70
monstercat = 1
waves = 0
gravity = 100
